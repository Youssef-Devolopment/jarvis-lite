name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Syntax-check every Python file
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.py -File . |
            Where-Object { $_.FullName -notmatch '__pycache__' }
          $errs = 0
          foreach ($f in $files) {
            python -m py_compile $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: $($f.FullName)"; $errs++ }
          }
          if ($errs -gt 0) { exit 1 }
          Write-Host "compiled $($files.Count) files"

      - name: Syntax-check frontend
        run: node --check static/js/lite.js
